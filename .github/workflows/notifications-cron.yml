name: Notifications cron

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: notifications-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the notifications endpoint
        env:
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://membersportal-lac.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set; cannot authenticate." >&2
            exit 1
          fi
          curl -fsS --max-time 60 -X GET "$BASE_URL/api/cron/notifications" \
            -H "Authorization: Bearer $CRON_SECRET"
